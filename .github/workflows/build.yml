name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk_pkg:
        description: 'Roblox packageName'
        default: 'com.roblox.client'
        required: false
      apk_slug:
        description: 'apkcombo slug for the app page'
        default: 'roblox'
        required: false
      apk_version:
        description: 'Roblox versionCode (2814 = 2.732.1043)'
        default: '2814'
        required: false
jobs:
  build-native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: ndk
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
      - name: build
        run: cmake --build build -j2
      - name: verify
        run: nm -D build/librobloxexec.so | grep -Eq " T JNI_OnLoad"
      - uses: actions/upload-artifact@v4
        with:
          name: librobloxexec-arm64
          path: build/librobloxexec.so
          retention-days: 14

  package-apk:
    needs: build-native
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: android sdk (android.jar + build-tools)
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          log-accepted-android-sdk-licenses: false

      - name: install sdk packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/android-34/android.jar" "$ANDROID_HOME/build-tools/34.0.0/d8" "$ANDROID_HOME/build-tools/34.0.0/apksigner" "$ANDROID_HOME/build-tools/34.0.0/zipalign"

      - name: baksmali
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /opt/baksmali.jar https://github.com/baksmali/smali/releases/download/v2.5.2/baksmali-2.5.2.jar
          ls -la /opt/baksmali.jar

      - name: compile java bridge -> smali
        shell: bash
        run: bash scripts/build_java.sh -o smali_out

      - name: fetch native lib artifact
        uses: actions/download-artifact@v4
        with:
          name: librobloxexec-arm64
          path: .

      - name: apkcombo download stock universal APK
        id: dl
        shell: bash
        run: |
          set -euo pipefail
          PKG="${{ inputs.apk_pkg }}"
          SLUG="${{ inputs.apk_slug }}"
          echo "package=$PKG slug=$SLUG"
          pip install -q typing_extensions curl_cffi
          python3 - "$PKG" "$SLUG" <<'EOF'
          import re, sys, os
          from curl_cffi import requests
          pkg, slug = sys.argv[1], sys.argv[2]
          got = False
          try:
              page = requests.get(
                  "https://apkcombo.com/%s/%s/download/apk" % (slug, pkg),
                  impersonate="chrome", timeout=60)
              if page.status_code == 200:
                  hrefs = re.findall(r'href="(/r2\?u=[^"]+)"', page.text)
                  if hrefs:
                      dl = requests.get("https://apkcombo.com" + hrefs[0],
                                        impersonate="chrome", timeout=1800,
                                        allow_redirects=True)
                      if dl.status_code == 200 and len(dl.content) > 5000000:
                          open("stock_universal.apk", "wb").write(dl.content)
                          got = True
                          print("apkcombo download ok:", len(dl.content), "bytes")
          except Exception as e:
              print("apkcombo failed:", type(e).__name__, str(e)[:120])
          if not got:
              print("falling back to release asset")
              os.system("curl -fsSL -o stock_universal.apk "
                        "https://github.com/pomnijaxx/roblox-mobile-exec/releases/"
                        "download/stock-roblox-2.732.1043/stock_roblox_universal.apk")
          data = open("stock_universal.apk", "rb").read()
          assert data[:2] == b"PK", "not a valid zip/apk"
          print("stock_universal.apk", len(data), "bytes")
          EOF
          ls -la stock_universal.apk

      - name: apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /opt/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          printf '#!/bin/sh\nexec java -jar /opt/apktool.jar "$@"\n' > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: patcher inject + rebuild + sign
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          python3 apktool/patcher.py \
            --apk stock_universal.apk \
            --lib librobloxexec.so \
            --smali-dir smali_out \
            --out roblox_patched.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias exec -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=RobloxExec, OU=Mobile, O=exec, C=US" 2>/dev/null || true
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f 4 roblox_patched.apk roblox_patched_aligned.apk
          mv roblox_patched_aligned.apk roblox_patched.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out roblox_patched_signed.apk roblox_patched.apk
          mv roblox_patched_signed.apk roblox_patched.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs roblox_patched.apk
          ls -la roblox_patched.apk

      - uses: actions/upload-artifact@v4
        with:
          name: roblox-patched-apk
          path: roblox_patched.apk
          retention-days: 14
          if-no-files-found: error
